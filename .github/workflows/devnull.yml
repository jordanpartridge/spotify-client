name: Post release to /dev/null

on:
  release:
    types: [published]

permissions: {}

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: dev-null-sh/dev-null.sh/.github/actions/commit@production
        with:
          body: |
            Released spotify-client ${{ github.event.release.tag_name }}. A simple Spotify Web API client for Laravel using Saloon. Work in progress - currently supports basic playback control and playlist operations. Built for my own
            ${{ github.event.release.html_url }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
